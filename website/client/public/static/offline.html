<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chores — offline</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #4F2A93; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center; padding: 24px;
  }
  .card { max-width: 30rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .75rem; }
  p { font-size: 1.0625rem; line-height: 1.5; opacity: .9; margin: 0 0 1.5rem; }
  button {
    font: inherit; font-weight: 600;
    background: #fff; color: #4F2A93; border: 0; border-radius: 8px;
    /* 44px minimum touch target, same rule as the task controls */
    min-height: 44px; padding: 0 1.5rem; cursor: pointer;
  }
  button:focus-visible { outline: 3px solid #BDA8FF; outline-offset: 3px; }
</style>
</head>
<body>
  <div class="card">
    <h1>No connection</h1>
    <p>Chores needs the home network. Check the wifi and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
